version: "1.0" # Required settings contract version; currently supported value is "1.0".

service:
  name: "devops-pipeline" # Required non-empty service identifier; normally matches the repository/service name.
  owner_team: "platform-team" # Required non-empty owning team identifier.
  language: "python" # Required implementation language identifier supported by the platform.

# One mapping per deployment environment; each name should be unique and categories should cover Dev, Pre-production, and Production.
environments:
  - name: "dpd-dev" # Required non-empty environment identifier; unique within this list.
    category: "Dev" # Required; allowed values: "Dev", "Pre-production", or "Production".
    account_id: "123456789012" # Required AWS account ID as a 12-digit string; replace this example with the target account.
    role_name: "replace-with-deployment-role" # Required IAM deployment role name; replace with the role configured in the target account.
    region: "eu-west-2" # Required AWS region; this scaffold supports "eu-west-2".
  - name: "dpd-preprod" # Required non-empty environment identifier; unique within this list.
    category: "Pre-production" # Required; allowed values: "Dev", "Pre-production", or "Production".
    account_id: "123456789012" # Required AWS account ID as a 12-digit string; replace this example with the target account.
    role_name: "replace-with-deployment-role" # Required IAM deployment role name; replace with the role configured in the target account.
    region: "eu-west-2" # Required AWS region; this scaffold supports "eu-west-2".
  - name: "dpd-prod" # Required non-empty environment identifier; unique within this list.
    category: "Production" # Required; allowed values: "Dev", "Pre-production", or "Production".
    account_id: "123456789012" # Required AWS account ID as a 12-digit string; replace this example with the target account.
    role_name: "replace-with-deployment-role" # Required IAM deployment role name; replace with the role configured in the target account.
    region: "eu-west-2" # Required AWS region; this scaffold supports "eu-west-2".

governance:
  retention_days: 30 # Required positive retention period in days; baseline value is 30.
  shared_workflow_ref: "v1" # Required shared workflow version/ref; use a published ref available to consumers.
  # Required non-empty list of approver team/group identifiers.
  approvers:
    - "platform-leads" # Replace with an authorized approver group for the service.

verification:
  health_endpoint: "/health" # Required absolute path for the post-deployment health check.
  timeout_seconds: 60 # Required positive health-check timeout in seconds; baseline value is 60.
  db_check_required: false # Required boolean; true enables the post-deployment database connectivity check.
