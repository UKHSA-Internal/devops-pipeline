version: "1.0"

service:
  name: "devops-pipeline"
  owner_team: "platform-team"
  language: "python"

environments:
  - name: "dpd-dev"
    category: "Dev"
    account_id: "123456789012"
    region: "eu-west-2"
  - name: "dpd-preprod"
    category: "Pre-production"
    account_id: "123456789012"
    region: "eu-west-2"
  - name: "dpd-prod"
    category: "Production"
    account_id: "123456789012"
    region: "eu-west-2"

governance:
  retention_days: 30
  shared_workflow_ref: "v1"
  approvers:
    - "platform-leads"

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
  db_check_required: false
