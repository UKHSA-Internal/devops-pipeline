name: Platform Pre-Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]

jobs:
  lint-and-validate:
    name: Contribution Rules and Settings Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' }}
        with:
          python-version: '3.11'

      - name: Validate contribution rules
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/contribution_rules.py pull-request

      - name: Prepare checker output capture
        run: |
          : > "$RUNNER_TEMP/standards-checker-output.txt"

      - name: Execute Self-Test (Standards Checker)
        id: standards-checker
        run: |
          set +e
          python3 packages/setting-checker/checker.py --config sample-app/.github/pipeline-settings.yml --strict 2>&1 \
            | tee "$RUNNER_TEMP/standards-checker-output.txt"
          checker_status=${PIPESTATUS[0]}
          echo "exit_code=$checker_status" >> "$GITHUB_OUTPUT"
          exit "$checker_status"

      - name: Write workflow run record
        if: always()
        uses: ./packages/shared-workflows/actions/run-record
        with:
          output_file: ${{ runner.temp }}/standards-checker-output.txt
          build_status: ${{ steps.standards-checker.outputs.exit_code || 'not run' }}
