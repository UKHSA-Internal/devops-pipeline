name: Platform Pre-Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]

jobs:
  lint-and-validate:
    name: Contribution Rules and Settings Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        if: ${{ env.ACT != 'true' }}
        with:
          python-version: '3.11'

      - name: Validate contribution rules
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/contribution_rules.py pull-request

      - name: Prepare checker output capture
        run: |
          : > "$RUNNER_TEMP/standards-checker-output.txt"

      - name: Install settings checker dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/settings-checker-venv"
          "$RUNNER_TEMP/settings-checker-venv/bin/pip" install --quiet -r packages/settings-checker/requirements.txt

      - name: Run unit tests
        run: |
          "$RUNNER_TEMP/settings-checker-venv/bin/python" -m unittest discover -s tests

      - name: Execute Self-Test (Standards Checker)
        id: standards-checker
        run: |
          set +e
          checker_status=0

          "$RUNNER_TEMP/settings-checker-venv/bin/python" packages/settings-checker/checker.py \
            sample-app --strict 2>&1 | tee -a "$RUNNER_TEMP/standards-checker-output.txt"
          status=${PIPESTATUS[0]}
          (( status == 0 )) || checker_status=$status

          # The template keeps its placeholder account IDs and replace-with-/
          # TODO text on purpose, so it must report exactly the expected
          # CHK-03 (account_id) and CHK-13 (placeholder) problems, not pass
          # --strict. The exact field-by-field list is asserted by
          # tests/test_settings_checker.py; this only checks the summary
          # counts so the two don't drift silently out of sync.
          template_output=$("$RUNNER_TEMP/settings-checker-venv/bin/python" packages/settings-checker/checker.py \
            packages/app-template --strict 2>&1)
          template_status=$?
          printf '%s\n' "$template_output" | tee -a "$RUNNER_TEMP/standards-checker-output.txt"
          if [[ "$template_status" -eq 1 ]] && grep -qF 'Not ready: 3 errors, 6 warnings' <<< "$template_output"; then
            echo "OK: app-template reports exactly 3 CHK-03 and 6 CHK-13 problems."
          else
            echo "FAIL: app-template must report exactly 3 CHK-03 and 6 CHK-13 problems (unedited placeholders)." >&2
            checker_status=1
          fi

          echo "exit_code=$checker_status" >> "$GITHUB_OUTPUT"
          exit "$checker_status"

      - name: Check docs/examples/pipeline-settings.yml
        run: |
          "$RUNNER_TEMP/settings-checker-venv/bin/python" packages/settings-checker/checker.py \
            --settings docs/examples/pipeline-settings.yml --strict

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint docs/examples/caller-workflow.yml
        run: actionlint docs/examples/caller-workflow.yml

      - name: Check settings fixtures
        run: |
          set +e -uo pipefail
          fixtures=tests/fixtures/settings
          failures=0

          expect() {
            local expected=$1 config=$2
            shift 2
            "$RUNNER_TEMP/settings-checker-venv/bin/python" packages/settings-checker/checker.py \
              --settings "$config" "$@" > /dev/null 2>&1
            local actual=$?
            if (( actual == expected )); then
              printf 'OK    exit %s: %s %s\n' "$actual" "$config" "$*"
            else
              printf 'FAIL  exit %s, expected %s: %s %s\n' "$actual" "$expected" "$config" "$*"
              failures=$((failures + 1))
            fi
          }

          expect 0 "$fixtures/compliant.yml" --strict
          for fixture in "$fixtures"/errors/*.yml; do
            expect 1 "$fixture"
            expect 0 "$fixture" --report-only
          done
          expect 0 "$fixtures/warnings-only.yml"
          expect 1 "$fixtures/warnings-only.yml" --strict
          expect 0 "$fixtures/warnings-only.yml" --report-only
          expect 1 "$fixtures/unparseable.yml"
          expect 1 "$fixtures/unparseable.yml" --strict
          expect 0 "$fixtures/unparseable.yml" --report-only

          (( failures == 0 ))

      - name: Publish checker summary
        if: always()
        uses: ./packages/shared-workflows/actions/publish-checker-summary
        with:
          output_file: ${{ runner.temp }}/standards-checker-output.txt
          checker_status: ${{ steps.standards-checker.outputs.exit_code || 'not run' }}
