name: Release Smoke Test

# Manual check against the published canary. The release workflow smoke-tests
# the release commit directly and does not call this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pipeline:
    name: 'Release Smoke Test'
    # TODO: Running inside the platform repository cannot catch every
    # cross-repository problem, for example a consumer's own token or
    # permissions.
    uses: UKHSA-Internal/devops-pipeline/.github/workflows/standard-pipeline.yml@v1-canary
    with:
      settings_path: sample-app/.github/pipeline-settings.yml
