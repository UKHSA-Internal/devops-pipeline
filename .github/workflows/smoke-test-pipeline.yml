name: Release Smoke Test

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pipeline:
    name: 'Release Smoke Test'
    # TODO: Switch to @v1-canary at the 1.0.0 cut-over.
    # TODO: Running inside the platform repository cannot catch every
    # cross-repository problem, for example a consumer's own token or
    # permissions.
    # No token is passed, so the optional platform_token uses its default.
    uses: UKHSA-Internal/devops-pipeline/.github/workflows/standard-pipeline.yml@v0-canary
    with:
      settings_path: sample-app/.github/pipeline-settings.yml
