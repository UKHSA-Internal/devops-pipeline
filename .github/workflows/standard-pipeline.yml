name: Standard Pipeline Orchestrator

on:
  workflow_call:
    inputs:
      settings_path:
        description: 'Path to pipeline settings file'
        required: false
        type: string

# No workflow-level permissions: a called workflow can only reduce what its
# caller grants, so every job sets contents: read itself. Only approval-guard
# and publish-report set none, so they inherit the caller's token and can read
# environments and the approval history when the caller grants actions: read.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      start_time: ${{ steps.started.outputs.start_time }}
      settings_path: ${{ steps.resolve-settings.outputs.settings_path }}
      service_directory: ${{ steps.resolve-settings.outputs.service_directory }}
      dev_deployments: ${{ steps.deployments.outputs.dev_deployments }}
      preprod_deployments: ${{ steps.deployments.outputs.preprod_deployments }}
      prod_deployments: ${{ steps.deployments.outputs.prod_deployments }}
      test_suites: ${{ steps.deployments.outputs.test_suites }}
      test_setup: ${{ steps.deployments.outputs.test_setup }}
      test_collect: ${{ steps.deployments.outputs.test_collect }}
      test_final_name: ${{ steps.deployments.outputs.test_final_name }}
      test_final_command: ${{ steps.deployments.outputs.test_final_command }}
      language: ${{ steps.deployments.outputs.language }}
      deployments: ${{ steps.deployments.outputs.deployments }}
      health_endpoint: ${{ steps.deployments.outputs.health_endpoint }}
      timeout_seconds: ${{ steps.deployments.outputs.timeout_seconds }}
      approval_mode: ${{ steps.deployments.outputs.approval_mode }}
      approval_environments: ${{ steps.deployments.outputs.approval_environments }}
      approval_exception_id: ${{ steps.deployments.outputs.approval_exception_id }}
      # Pull requests build nothing and deploy nowhere; Pre-production and
      # Production deploy only on a push to main. Computed once here so every
      # downstream job references the same named condition instead of
      # repeating the underlying event/ref checks.
      should_build_and_deploy: ${{ github.event_name != 'pull_request' }}
      should_deploy_main_only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Record Pipeline Start
        id: started
        shell: bash
        run: echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Resolve Settings File
        id: resolve-settings
        shell: bash
        env:
          SETTINGS_PATH_INPUT: ${{ inputs.settings_path }}
        run: |
          set -euo pipefail

          if [[ "$SETTINGS_PATH_INPUT" == *$'\n'* || "$SETTINGS_PATH_INPUT" == *$'\r'* ]]; then
            echo "ERROR: settings_path must not contain newline characters." >&2
            exit 1
          fi

          if [[ -n "$SETTINGS_PATH_INPUT" ]]; then
            if [[ ! -f "$SETTINGS_PATH_INPUT" ]]; then
              printf 'ERROR: settings_path was provided but the file does not exist: %s\n' "$SETTINGS_PATH_INPUT" >&2
              exit 1
            fi
            settings_path="$SETTINGS_PATH_INPUT"
          elif [[ -f .github/pipeline-settings.yml ]]; then
            settings_path=".github/pipeline-settings.yml"
          else
            shopt -s nullglob
            matches=( */.github/pipeline-settings.yml )
            if (( ${#matches[@]} == 0 )); then
              echo "ERROR: No pipeline settings file found." >&2
              exit 1
            fi
            if (( ${#matches[@]} > 1 )); then
              printf 'ERROR: Expected exactly one */.github/pipeline-settings.yml fallback, found %s: %s\n' \
                "${#matches[@]}" "${matches[*]}" >&2
              exit 1
            fi
            settings_path="${matches[0]}"
          fi

          service_directory="$(dirname -- "$(dirname -- "$settings_path")")"
          printf 'settings_path=%s\n' "$settings_path" >> "$GITHUB_OUTPUT"
          printf 'service_directory=%s\n' "$service_directory" >> "$GITHUB_OUTPUT"
          printf '[STEP: CHECK] Settings file exists: %s\n' "$settings_path"
          {
            printf '## Check\n\n'
            printf -- '- Settings file: `%s`\n' "$settings_path"
            printf -- '- Service directory: `%s`\n' "$service_directory"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute Check Step
        id: check
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/check@45e017fa672af426938828c466d411b9e0da913d
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Resolve Deployments
        id: deployments
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/resolve-deployments@45e017fa672af426938828c466d411b9e0da913d
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Record Check Result
        if: always()
        shell: bash
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          printf '[STEP: CHECK] %s\n' "$CHECK_RESULT"
          printf -- '- Check action: **%s**\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

  # The Test stage is several jobs: one job per suite, an optional final step,
  # and the "test" job that gives the stage one result. Setup runs at the start of
  # each suite job and of the final step.
  test-suites:
    name: Test (${{ matrix.suite.name }})
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.check.outputs.test_suites || '[]') }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Set Up Runtime
        id: runtime
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/test-runtime@45e017fa672af426938828c466d411b9e0da913d
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          language: ${{ needs.check.outputs.language }}

      - name: Run Setup
        if: ${{ needs.check.outputs.test_setup != '' }}
        shell: bash
        working-directory: ${{ needs.check.outputs.service_directory }}
        env:
          SETUP_COMMAND: ${{ needs.check.outputs.test_setup }}
          SUITE_NAME: ${{ matrix.suite.name }}
        run: |
          set -euo pipefail
          printf '[STEP: TEST] %s: running setup: %s\n' "$SUITE_NAME" "$SETUP_COMMAND"
          bash -e -o pipefail -c "$SETUP_COMMAND"

      - name: Run Suite
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/test-run@45e017fa672af426938828c466d411b9e0da913d
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          kind: suite
          name: ${{ matrix.suite.name }}
          command: ${{ matrix.suite.command }}
          runtime: ${{ steps.runtime.outputs.description }}
          collect: ${{ needs.check.outputs.test_collect }}

  test-final:
    name: Test (final step)
    needs: [check, test-suites]
    if: >-
      !cancelled() && needs.check.result == 'success'
      && needs.check.outputs.test_final_name != ''
      && needs.test-suites.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Set Up Runtime
        id: runtime
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/test-runtime@45e017fa672af426938828c466d411b9e0da913d
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          language: ${{ needs.check.outputs.language }}

      # Setup runs before the download, so it can never delete the downloaded files.
      - name: Run Setup
        if: ${{ needs.check.outputs.test_setup != '' }}
        shell: bash
        working-directory: ${{ needs.check.outputs.service_directory }}
        env:
          SETUP_COMMAND: ${{ needs.check.outputs.test_setup }}
          FINAL_NAME: ${{ needs.check.outputs.test_final_name }}
        run: |
          set -euo pipefail
          printf '[STEP: TEST] %s: running setup: %s\n' "$FINAL_NAME" "$SETUP_COMMAND"
          bash -e -o pipefail -c "$SETUP_COMMAND"

      # Under act the jobs share the bound workspace, so the files are already there.
      - name: Download Suite Files
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-*
          path: ${{ needs.check.outputs.service_directory }}
          merge-multiple: true

      - name: Run Final Step
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/test-run@45e017fa672af426938828c466d411b9e0da913d
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          kind: final
          name: ${{ needs.check.outputs.test_final_name }}
          command: ${{ needs.check.outputs.test_final_command }}
          runtime: ${{ steps.runtime.outputs.description }}

  # One result for the whole Test stage, so Scan and the run record don't need
  # to know how many jobs it has. Skipped when Check fails.
  test:
    name: Test
    needs: [check, test-suites, test-final]
    # Runs even when cancelled: it runs no service code and has no permissions, and
    # it must record suites that finished.
    if: ${{ always() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Aggregate Test Results
        shell: bash
        env:
          HAS_FINAL: ${{ needs.check.outputs.test_final_name != '' }}
          SUITES_RESULT: ${{ needs.test-suites.result }}
          FINAL_RESULT: ${{ needs.test-final.result }}
        run: |
          set -euo pipefail
          status=0
          [[ "$SUITES_RESULT" == "success" ]] || status=1
          [[ "$HAS_FINAL" != "true" || "$FINAL_RESULT" == "success" ]] || status=1
          printf '[STEP: TEST] Suites: %s, final: %s\n' "$SUITES_RESULT" "$FINAL_RESULT"
          {
            printf '## Test\n\n'
            printf -- '- Suites: **%s**\n- Final step: **%s**\n' "$SUITES_RESULT" "$FINAL_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  scan:
    name: Scan
    needs: test
    # Explicit status checks: the default success() also skips a job when any
    # ancestor was skipped, and the final step skips by design.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Scan Step
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/scan@45e017fa672af426938828c466d411b9e0da913d

  build:
    name: Build
    needs: [check, scan]
    if: >-
      !cancelled()
      && needs.scan.result == 'success'
      && needs.check.outputs.should_build_and_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Build Step
        id: build
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/build-app@45e017fa672af426938828c466d411b9e0da913d
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          commit_sha: ${{ github.sha }}

  deploy-dev:
    name: Deploy Development (${{ matrix.deployment.name }})
    needs: [check, build]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.check.outputs.should_build_and_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.dev_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    # TODO: Grant id-token: write when the deployment implementation uses OIDC.
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/deploy@45e017fa672af426938828c466d411b9e0da913d
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-DEV
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/verify-app@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/record-deployment@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}
          deploy_simulated: ${{ steps.deploy.outputs.simulated }}
          verify_simulated: ${{ steps.verify.outputs.simulated }}

  deploy-preprod:
    name: Deploy Pre-production (${{ matrix.deployment.name }})
    needs: [check, build, deploy-dev]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.deploy-dev.result == 'success'
      && needs.check.outputs.should_deploy_main_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.preprod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/deploy@45e017fa672af426938828c466d411b9e0da913d
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-PREPROD
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/verify-app@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/record-deployment@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}
          deploy_simulated: ${{ steps.deploy.outputs.simulated }}
          verify_simulated: ${{ steps.verify.outputs.simulated }}

  # Approval gate. Each approve job only logs a marker; the required reviewers on
  # its GitHub environment do the gating. The guard fails first if an environment
  # is missing or has no reviewers, because GitHub would otherwise auto-create
  # a missing environment with no protection.
  approval-guard:
    name: Approval Guard
    needs: [check, deploy-preprod]
    if: >-
      !cancelled()
      && needs.deploy-preprod.result == 'success'
      && needs.check.outputs.should_deploy_main_only == 'true'
    runs-on: ubuntu-latest
    # No permissions block on purpose: inherit the caller's token, which needs
    # actions: read to read environment settings.
    outputs:
      gate_opened_at: ${{ steps.guard.outputs.gate_opened_at }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Check Approval Environments
        id: guard
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/approval-guard@45e017fa672af426938828c466d411b9e0da913d
        with:
          approval_environments: ${{ needs.check.outputs.approval_environments }}

      - name: Log Unattended Exception
        if: needs.check.outputs.approval_mode == 'unattended'
        shell: bash
        env:
          EXCEPTION_ID: ${{ needs.check.outputs.approval_exception_id }}
        run: |
          printf '[STEP: APPROVAL] unattended Production deployment under exception %s; no approval jobs.\n' "$EXCEPTION_ID"

  approve:
    name: Approve Production (${{ matrix.approval.environment }})
    # The report finds this job by name: keep it equal to APPROVAL_JOB_NAME in
    # publish-run-report/approvals.py (a test checks).
    needs: [check, approval-guard]
    if: >-
      !cancelled()
      && needs.approval-guard.result == 'success'
      && needs.check.outputs.should_deploy_main_only == 'true'
      && needs.check.outputs.approval_mode != 'unattended'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ matrix.approval.environment }}
    strategy:
      # A rejection cancels the sibling approvals still waiting.
      fail-fast: true
      matrix:
        approval: ${{ fromJSON(needs.check.outputs.approval_environments || '[]') }}
    # A newer run reaching this gate supersedes an older run still waiting on it.
    concurrency:
      group: approval-gate-${{ needs.check.outputs.settings_path }}-${{ matrix.approval.environment }}
      cancel-in-progress: true
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Confirm Approval
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/approval-confirm@45e017fa672af426938828c466d411b9e0da913d
        with:
          environment: ${{ matrix.approval.environment }}
          groups: ${{ join(matrix.approval.groups, ', ') }}
          gate_opened_at: ${{ needs.approval-guard.outputs.gate_opened_at }}
          max_age_hours: '24'

  deploy-prod:
    name: Deploy Production (${{ matrix.deployment.name }})
    needs: [check, build, deploy-preprod, approval-guard, approve]
    # !cancelled() replaces the implicit success() so Production can still run
    # when approve is skipped (unattended). Every dependency is checked
    # explicitly, and only the exact string 'unattended' accepts a skipped
    # approve, so a failed Check (empty outputs) can never open the gate.
    if: >-
      !cancelled()
      && needs.check.outputs.should_deploy_main_only == 'true'
      && needs.build.result == 'success'
      && needs.deploy-preprod.result == 'success'
      && needs.approval-guard.result == 'success'
      && (
        (needs.check.outputs.approval_mode != 'unattended' && needs.approve.result == 'success')
        || (needs.check.outputs.approval_mode == 'unattended' && needs.approve.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.prod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/deploy@45e017fa672af426938828c466d411b9e0da913d
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-PROD
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/verify-app@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: UKHSA-Internal/devops-pipeline/packages/shared-workflows/actions/record-deployment@45e017fa672af426938828c466d411b9e0da913d
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}
          deploy_simulated: ${{ steps.deploy.outputs.simulated }}
          verify_simulated: ${{ steps.verify.outputs.simulated }}

  publish-report:
    name: Publish Run Report
    needs: [check, test, scan, build, deploy-dev, deploy-preprod, approval-guard, approve, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    # No permissions block on purpose: inherit the caller's token, which needs
    # actions: read to read the approval history. Without it the run record
    # sets approvals_unavailable.
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Publish Run Report
