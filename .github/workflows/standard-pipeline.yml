name: Standard Pipeline Orchestrator

on:
  workflow_call:
    inputs:
      settings_path:
        description: 'Path to pipeline settings file'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      settings_path: ${{ steps.resolve-settings.outputs.settings_path }}
      service_directory: ${{ steps.resolve-settings.outputs.service_directory }}
      start_time: ${{ steps.started.outputs.start_time }}
      dev_deployments: ${{ steps.deployments-local.outputs.dev_deployments || steps.deployments-central.outputs.dev_deployments }}
      preprod_deployments: ${{ steps.deployments-local.outputs.preprod_deployments || steps.deployments-central.outputs.preprod_deployments }}
      prod_deployments: ${{ steps.deployments-local.outputs.prod_deployments || steps.deployments-central.outputs.prod_deployments }}
      deployments: ${{ steps.deployments-local.outputs.deployments || steps.deployments-central.outputs.deployments }}
      health_endpoint: ${{ steps.deployments-local.outputs.health_endpoint || steps.deployments-central.outputs.health_endpoint }}
      timeout_seconds: ${{ steps.deployments-local.outputs.timeout_seconds || steps.deployments-central.outputs.timeout_seconds }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Record Pipeline Start
        id: started
        shell: bash
        run: |
          python3 -c 'from datetime import datetime, timezone; print("start_time=" + datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"))' \
            >> "$GITHUB_OUTPUT"

      - name: Resolve Settings File
        id: resolve-settings
        shell: bash
        env:
          SETTINGS_PATH_INPUT: ${{ inputs.settings_path }}
        run: |
          set -euo pipefail

          if [[ "$SETTINGS_PATH_INPUT" == *$'\n'* || "$SETTINGS_PATH_INPUT" == *$'\r'* ]]; then
            echo "ERROR: settings_path must not contain newline characters." >&2
            exit 1
          fi

          if [[ -n "$SETTINGS_PATH_INPUT" ]]; then
            if [[ ! -f "$SETTINGS_PATH_INPUT" ]]; then
              printf 'ERROR: settings_path was provided but the file does not exist: %s\n' "$SETTINGS_PATH_INPUT" >&2
              exit 1
            fi
            settings_path="$SETTINGS_PATH_INPUT"
          elif [[ -f .github/pipeline-settings.yml ]]; then
            settings_path=".github/pipeline-settings.yml"
          else
            shopt -s nullglob
            matches=( */.github/pipeline-settings.yml )
            if (( ${#matches[@]} == 0 )); then
              echo "ERROR: No pipeline settings file found." >&2
              exit 1
            fi
            if (( ${#matches[@]} > 1 )); then
              printf 'ERROR: Expected exactly one */.github/pipeline-settings.yml fallback, found %s: %s\n' \
                "${#matches[@]}" "${matches[*]}" >&2
              exit 1
            fi
            settings_path="${matches[0]}"
          fi

          service_directory="$(dirname -- "$(dirname -- "$settings_path")")"
          printf 'settings_path=%s\n' "$settings_path" >> "$GITHUB_OUTPUT"
          printf 'service_directory=%s\n' "$service_directory" >> "$GITHUB_OUTPUT"
          printf '[STAGE: CHECK] Settings file exists: %s\n' "$settings_path"
          {
            printf '## Check\n\n'
            printf -- '- Settings file: `%s`\n' "$settings_path"
            printf -- '- Service directory: `%s`\n' "$service_directory"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      # TODO: Enable settings schema validation when checker.py supports it.
      - name: Execute Check Stage (local action)
        id: check-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/check
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Execute Check Stage (central action)
        id: check-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/check
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Resolve Deployments (local action)
        id: deployments-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/resolve-deployments
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Resolve Deployments (central action)
        id: deployments-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/resolve-deployments
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Record Check Result
        if: always()
        shell: bash
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          printf '[STAGE: CHECK] %s\n' "$CHECK_RESULT"
          printf -- '- Check action: **%s**\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Test Stage (local action)
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/test

      - name: Execute Test Stage (central action)
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/test

  scan:
    name: Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Scan Stage (local action)
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/scan

      - name: Execute Scan Stage (central action)
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/scan

  build:
    name: Build
    needs: [check, scan]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-local.outputs.image_tag || steps.build-central.outputs.image_tag }}
      checksum: ${{ steps.build-local.outputs.checksum || steps.build-central.outputs.checksum }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Build Stage (local action)
        id: build-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/build-app
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          commit_sha: ${{ github.sha }}

      - name: Execute Build Stage (central action)
        id: build-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/build-app
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          commit_sha: ${{ github.sha }}

  deploy-dev:
    name: Deploy Dev (${{ matrix.deployment.name }})
    needs: [check, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.dev_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    # TODO: Grant id-token: write when the deployment implementation uses OIDC.
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Deploy Stage (local action)
        id: deploy-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-DEV
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Execute Deploy Stage (central action)
        id: deploy-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-DEV
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment (local action)
        id: verify-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Verify Deployment (central action)
        id: verify-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Record Deployment Result (local action)
        if: ${{ always() && env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

      - name: Record Deployment Result (central action)
        if: ${{ always() && env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

  deploy-preprod:
    name: Deploy Pre-production (${{ matrix.deployment.name }})
    needs: [check, deploy-dev]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.preprod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Deploy Stage (local action)
        id: deploy-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-PREPROD
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Execute Deploy Stage (central action)
        id: deploy-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-PREPROD
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment (local action)
        id: verify-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Verify Deployment (central action)
        id: verify-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Record Deployment Result (local action)
        if: ${{ always() && env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

      - name: Record Deployment Result (central action)
        if: ${{ always() && env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

  deploy-prod:
    name: Deploy Production (${{ matrix.deployment.name }})
    needs: [check, deploy-preprod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.prod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    # TODO: Add the Production approval gate when deployment environments are introduced.
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Execute Deploy Stage (local action)
        id: deploy-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-PROD
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Execute Deploy Stage (central action)
        id: deploy-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          stage_name: DEPLOY-PROD
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment (local action)
        id: verify-local
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Verify Deployment (central action)
        id: verify-central
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}

      - name: Record Deployment Result (local action)
        if: ${{ always() && env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

      - name: Record Deployment Result (central action)
        if: ${{ always() && env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          deploy_outcome: ${{ steps.deploy-local.outcome == 'skipped' && steps.deploy-central.outcome || steps.deploy-local.outcome }}
          verify_outcome: ${{ steps.verify-local.outcome == 'skipped' && steps.verify-central.outcome || steps.verify-local.outcome }}

  publish-report:
    name: Publish Run Report
    needs: [check, test, scan, build, deploy-dev, deploy-preprod, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}

      - name: Checkout Platform Central Workflows
        uses: actions/checkout@v4
        if: ${{ env.ACT != 'true' }}
        with:
          repository: 'UKHSA/devops-pipeline'
          path: '.platform-temp'
          ref: v1

      - name: Publish Run Report (local action)
        if: ${{ env.ACT == 'true' }}
        uses: ./packages/shared-workflows/actions/publish-run-report
        with:
          check_result: ${{ needs.check.result }}
          test_result: ${{ needs.test.result }}
          scan_result: ${{ needs.scan.result }}
          build_result: ${{ needs.build.result }}
          deploy_dev_result: ${{ needs.deploy-dev.result }}
          deploy_preprod_result: ${{ needs.deploy-preprod.result }}
          deploy_prod_result: ${{ needs.deploy-prod.result }}
          deployments: ${{ needs.check.outputs.deployments }}
          start_time: ${{ needs.check.outputs.start_time }}

      - name: Publish Run Report (central action)
        if: ${{ env.ACT != 'true' }}
        uses: ./.platform-temp/packages/shared-workflows/actions/publish-run-report
        with:
          check_result: ${{ needs.check.result }}
          test_result: ${{ needs.test.result }}
          scan_result: ${{ needs.scan.result }}
          build_result: ${{ needs.build.result }}
          deploy_dev_result: ${{ needs.deploy-dev.result }}
          deploy_preprod_result: ${{ needs.deploy-preprod.result }}
          deploy_prod_result: ${{ needs.deploy-prod.result }}
          deployments: ${{ needs.check.outputs.deployments }}
          start_time: ${{ needs.check.outputs.start_time }}
