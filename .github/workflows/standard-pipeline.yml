name: Standard Pipeline Orchestrator

on:
  workflow_call:
    inputs:
      settings_path:
        description: 'Path to pipeline settings file'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.started.outputs.start_time }}
      settings_path: ${{ steps.resolve-settings.outputs.settings_path }}
      service_directory: ${{ steps.resolve-settings.outputs.service_directory }}
      dev_deployments: ${{ steps.deployments.outputs.dev_deployments }}
      preprod_deployments: ${{ steps.deployments.outputs.preprod_deployments }}
      prod_deployments: ${{ steps.deployments.outputs.prod_deployments }}
      test_command: ${{ steps.deployments.outputs.test_command }}
      deployments: ${{ steps.deployments.outputs.deployments }}
      health_endpoint: ${{ steps.deployments.outputs.health_endpoint }}
      timeout_seconds: ${{ steps.deployments.outputs.timeout_seconds }}
    steps:
      - name: Record Pipeline Start
        id: started
        shell: bash
        run: echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Resolve Settings File
        id: resolve-settings
        shell: bash
        env:
          SETTINGS_PATH_INPUT: ${{ inputs.settings_path }}
        run: |
          set -euo pipefail

          if [[ "$SETTINGS_PATH_INPUT" == *$'\n'* || "$SETTINGS_PATH_INPUT" == *$'\r'* ]]; then
            echo "ERROR: settings_path must not contain newline characters." >&2
            exit 1
          fi

          if [[ -n "$SETTINGS_PATH_INPUT" ]]; then
            if [[ ! -f "$SETTINGS_PATH_INPUT" ]]; then
              printf 'ERROR: settings_path was provided but the file does not exist: %s\n' "$SETTINGS_PATH_INPUT" >&2
              exit 1
            fi
            settings_path="$SETTINGS_PATH_INPUT"
          elif [[ -f .github/pipeline-settings.yml ]]; then
            settings_path=".github/pipeline-settings.yml"
          else
            shopt -s nullglob
            matches=( */.github/pipeline-settings.yml )
            if (( ${#matches[@]} == 0 )); then
              echo "ERROR: No pipeline settings file found." >&2
              exit 1
            fi
            if (( ${#matches[@]} > 1 )); then
              printf 'ERROR: Expected exactly one */.github/pipeline-settings.yml fallback, found %s: %s\n' \
                "${#matches[@]}" "${matches[*]}" >&2
              exit 1
            fi
            settings_path="${matches[0]}"
          fi

          service_directory="$(dirname -- "$(dirname -- "$settings_path")")"
          printf 'settings_path=%s\n' "$settings_path" >> "$GITHUB_OUTPUT"
          printf 'service_directory=%s\n' "$service_directory" >> "$GITHUB_OUTPUT"
          printf '[STEP: CHECK] Settings file exists: %s\n' "$settings_path"
          {
            printf '## Check\n\n'
            printf -- '- Settings file: `%s`\n' "$settings_path"
            printf -- '- Service directory: `%s`\n' "$service_directory"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Execute Check Step
        id: check
        uses: ./packages/shared-workflows/actions/check
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Resolve Deployments
        id: deployments
        uses: ./packages/shared-workflows/actions/resolve-deployments
        with:
          settings_path: ${{ steps.resolve-settings.outputs.settings_path }}

      - name: Record Check Result
        if: always()
        shell: bash
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          printf '[STEP: CHECK] %s\n' "$CHECK_RESULT"
          printf -- '- Check action: **%s**\n' "$CHECK_RESULT" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Test Step
        uses: ./packages/shared-workflows/actions/test
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          test_command: ${{ needs.check.outputs.test_command }}

  scan:
    name: Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Scan Step
        uses: ./packages/shared-workflows/actions/scan

  build:
    name: Build
    needs: [check, scan]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Build Step
        id: build
        uses: ./packages/shared-workflows/actions/build-app
        with:
          service_directory: ${{ needs.check.outputs.service_directory }}
          commit_sha: ${{ github.sha }}

  deploy-dev:
    name: Deploy Development (${{ matrix.deployment.name }})
    needs: [check, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.dev_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    # TODO: Grant id-token: write when the deployment implementation uses OIDC.
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-DEV
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}

  deploy-preprod:
    name: Deploy Pre-production (${{ matrix.deployment.name }})
    needs: [check, build, deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.preprod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-PREPROD
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}

  deploy-prod:
    name: Deploy Production (${{ matrix.deployment.name }})
    needs: [check, build, deploy-preprod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        deployment: ${{ fromJSON(needs.check.outputs.prod_deployments || '[]') }}
    concurrency:
      group: deployment-${{ matrix.deployment.name }}
      cancel-in-progress: false
    # TODO: Add the Production approval gate when deployment environments are introduced.
    steps:
      - name: Mark Deployment Started
        shell: bash
        env:
          DEPLOYMENT_NAME: ${{ matrix.deployment.name }}
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            started_directory=".act-artifacts/started"
          else
            started_directory="deployment-started"
          fi
          mkdir -p "$started_directory"
          : > "$started_directory/$DEPLOYMENT_NAME"

      - name: Upload Deployment Started Marker
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-started-${{ matrix.deployment.name }}
          path: deployment-started/${{ matrix.deployment.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Execute Deploy Step
        id: deploy
        uses: ./packages/shared-workflows/actions/deploy
        with:
          environment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          step_name: DEPLOY-PROD
          image_tag: ${{ needs.build.outputs.image_tag }}
          account_id: ${{ matrix.deployment.account_id }}
          role_name: ${{ matrix.deployment.role_name }}
          region: ${{ matrix.deployment.region }}

      - name: Verify Deployment
        id: verify
        uses: ./packages/shared-workflows/actions/verify-app
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          health_endpoint: ${{ needs.check.outputs.health_endpoint }}
          timeout_seconds: ${{ needs.check.outputs.timeout_seconds }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Record Deployment Result
        if: always()
        uses: ./packages/shared-workflows/actions/record-deployment
        with:
          deployment_name: ${{ matrix.deployment.name }}
          category: ${{ matrix.deployment.category }}
          image_tag: ${{ needs.build.outputs.image_tag }}
          deploy_outcome: ${{ steps.deploy.outcome }}
          verify_outcome: ${{ steps.verify.outcome }}

  publish-report:
    name: Publish Run Report
    needs: [check, test, scan, build, deploy-dev, deploy-preprod, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - name: Publish Run Report
        uses: ./packages/shared-workflows/actions/publish-run-report
        with:
          check_result: ${{ needs.check.result }}
          test_result: ${{ needs.test.result }}
          scan_result: ${{ needs.scan.result }}
          build_result: ${{ needs.build.result }}
          deploy_dev_result: ${{ needs.deploy-dev.result }}
          deploy_preprod_result: ${{ needs.deploy-preprod.result }}
          deploy_prod_result: ${{ needs.deploy-prod.result }}
          deployments: ${{ needs.check.outputs.deployments }}
          start_time: ${{ needs.check.outputs.start_time }}
          trigger_type: ${{ github.event_name }}
