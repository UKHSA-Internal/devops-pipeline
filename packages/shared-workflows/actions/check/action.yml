name: Pipeline Check Action
description: Checks that pipeline-settings.yml is readable; schema validation is pending

inputs:
  settings_path:
    description: 'Path to pipeline settings file'
    required: true
    default: '.github/pipeline-settings.yml'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Standards Check Tool
      shell: bash
      env:
        SETTINGS_PATH: ${{ inputs.settings_path }}
      run: |
        python3 "${{ github.action_path }}/../../../setting-checker/checker.py" --config "$SETTINGS_PATH"
