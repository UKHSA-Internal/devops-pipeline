name: Deploy Step
description: Placeholder deployment step for a single named deployment

inputs:
  environment_name:
    description: Name of the deployment target
    required: true
  category:
    description: Environment category (Dev, Pre-production or Production)
    required: true
  step_name:
    description: Step identifier used in the log marker
    required: true
  account_id:
    description: Target account ID
    required: true
  role_name:
    description: Role the deployment will assume
    required: true
  region:
    description: Target region
    required: true
  image_tag:
    description: Full commit SHA tag of the built image
    required: true

runs:
  using: composite
  steps:
    - name: Run Deploy Placeholder
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        CATEGORY: ${{ inputs.category }}
        STEP_NAME: ${{ inputs.step_name }}
        ACCOUNT_ID: ${{ inputs.account_id }}
        ROLE_NAME: ${{ inputs.role_name }}
        REGION: ${{ inputs.region }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        printf '[STEP: %s] Deploy %s to %s (%s): would assume %s in account %s (%s); not yet implemented.\n' \
          "$STEP_NAME" "$IMAGE_TAG" "$ENVIRONMENT_NAME" "$CATEGORY" "$ROLE_NAME" "$ACCOUNT_ID" "$REGION"
        {
          printf '## Deploy %s\n\n' "$ENVIRONMENT_NAME"
          printf 'Image: `%s`\n\n' "$IMAGE_TAG"
          printf 'Deploy to %s (%s): not yet implemented.\n' "$ENVIRONMENT_NAME" "$CATEGORY"
        } >> "$GITHUB_STEP_SUMMARY"
