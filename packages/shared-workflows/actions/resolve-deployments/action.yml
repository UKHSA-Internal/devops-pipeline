name: Resolve Deployments
description: Resolves the named deployments for each environment category and the verification settings

inputs:
  settings_path:
    description: Path to the pipeline settings file
    required: true

outputs:
  test_plan:
    description: JSON test plan (setup, cache, suites, collect, final) resolved from service.test or service.test_command
    value: ${{ steps.resolve.outputs.test_plan }}
  test_suites:
    description: JSON list of the suites, each with a name and a command
    value: ${{ steps.resolve.outputs.test_suites }}
  test_setup:
    description: Setup command, or empty
    value: ${{ steps.resolve.outputs.test_setup }}
  test_has_cache:
    description: "true when the test plan has a cache"
    value: ${{ steps.resolve.outputs.test_has_cache }}
  test_cache_paths:
    description: Cache paths, one per line, relative to the repository root
    value: ${{ steps.resolve.outputs.test_cache_paths }}
  test_cache_key_files:
    description: Cache key file patterns, one per line, relative to the repository root
    value: ${{ steps.resolve.outputs.test_cache_key_files }}
  test_collect:
    description: Files each suite uploads for the final step, one pattern per line, relative to the service directory
    value: ${{ steps.resolve.outputs.test_collect }}
  test_has_final:
    description: "true when the test plan has a final step"
    value: ${{ steps.resolve.outputs.test_has_final }}
  test_final_name:
    description: Name of the final step, or empty
    value: ${{ steps.resolve.outputs.test_final_name }}
  test_final_command:
    description: Command of the final step, or empty
    value: ${{ steps.resolve.outputs.test_final_command }}
  language:
    description: Service language, lower-cased, used to set up the Test step's runtime
    value: ${{ steps.resolve.outputs.language }}
  dev_deployments:
    description: JSON list of Development deployments
    value: ${{ steps.resolve.outputs.dev_deployments }}
  preprod_deployments:
    description: JSON list of Pre-production deployments
    value: ${{ steps.resolve.outputs.preprod_deployments }}
  prod_deployments:
    description: JSON list of Production deployments
    value: ${{ steps.resolve.outputs.prod_deployments }}
  deployments:
    description: JSON list of all deployments in promotion order
    value: ${{ steps.resolve.outputs.deployments }}
  health_endpoint:
    description: Health endpoint path used to verify each deployment
    value: ${{ steps.resolve.outputs.health_endpoint }}
  timeout_seconds:
    description: Verification timeout in seconds
    value: ${{ steps.resolve.outputs.timeout_seconds }}
  approval_mode:
    description: Production approval mode (all-approvers, single-approver or unattended)
    value: ${{ steps.resolve.outputs.approval_mode }}
  approval_environments:
    description: JSON list of approval environments and the approver groups each covers; empty when unattended
    value: ${{ steps.resolve.outputs.approval_environments }}
  approval_exception_id:
    description: Architecture Exception ID, set only when the mode is unattended
    value: ${{ steps.resolve.outputs.approval_exception_id }}

runs:
  using: composite
  steps:
    - name: Resolve Deployments
      id: resolve
      shell: bash
      env:
        SETTINGS_PATH: ${{ inputs.settings_path }}
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/settings-venv"
        "$RUNNER_TEMP/settings-venv/bin/pip" install --quiet pyyaml==6.0.3
        "$RUNNER_TEMP/settings-venv/bin/python" "${{ github.action_path }}/resolve_deployments.py" "$SETTINGS_PATH"
