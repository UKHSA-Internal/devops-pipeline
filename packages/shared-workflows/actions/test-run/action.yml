name: Test Run
description: Runs one test suite or the final step from the test plan, then records its result and uploads its files

inputs:
  service_directory:
    description: Service directory the command runs in
    required: true
  kind:
    description: suite or final
    required: true
  name:
    description: Suite name, or final step name, from the test plan
    required: true
  command:
    description: Single-line command from the test plan
    required: true
  setup_command:
    description: Setup command from the test plan
    required: false
    default: ''
  run_setup:
    description: Set to true to run the setup command before the command
    required: false
    default: 'false'
  collect:
    description: Newline-separated files to upload besides test-results/*.xml, relative to the service directory
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run Setup
      id: setup
      if: ${{ inputs.run_setup == 'true' && inputs.setup_command != '' }}
      shell: bash
      env:
        SERVICE_DIRECTORY: ${{ inputs.service_directory }}
        SETUP_COMMAND: ${{ inputs.setup_command }}
        STEP_NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        printf '[STEP: TEST] %s: running setup in %s: %s\n' "$STEP_NAME" "$SERVICE_DIRECTORY" "$SETUP_COMMAND"
        cd "$SERVICE_DIRECTORY"
        bash -e -o pipefail -c "$SETUP_COMMAND"

    - name: Run Command
      id: run
      shell: bash
      env:
        SERVICE_DIRECTORY: ${{ inputs.service_directory }}
        COMMAND: ${{ inputs.command }}
        STEP_NAME: ${{ inputs.name }}
        STEP_KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        printf '[STEP: TEST] %s (%s): running in %s: %s\n' "$STEP_NAME" "$STEP_KIND" "$SERVICE_DIRECTORY" "$COMMAND"
        cd "$SERVICE_DIRECTORY"
        status=0
        bash -e -o pipefail -c "$COMMAND" || status=$?
        printf '[STEP: TEST] %s (%s): exit code %s\n' "$STEP_NAME" "$STEP_KIND" "$status"
        exit "$status"

    - name: Record Result
      if: ${{ always() }}
      shell: bash
      env:
        SERVICE_DIRECTORY: ${{ inputs.service_directory }}
        SUITE_NAME: ${{ inputs.name }}
        STEP_KIND: ${{ inputs.kind }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
      run: |
        set -euo pipefail
        if [[ "${ACT:-}" == "true" ]]; then
          export RESULT_DIRECTORY="$GITHUB_WORKSPACE/.act-artifacts/test-suites"
        else
          export RESULT_DIRECTORY="$RUNNER_TEMP/test-suite-result"
        fi
        python3 "${{ github.action_path }}/junit_summary.py"

    # The test-<suite> artifact holds the collect files and test-results/*.xml. Each suite's
    # summary (tests, failures, errors, duration) is built from its own XML before this upload,
    # so the final step's download merging same-named XML files from several suites, with
    # one overwriting another, doesn't change any result.
    - name: Stage Suite Files
      if: ${{ always() && inputs.kind == 'suite' && env.ACT != 'true' }}
      shell: bash
      env:
        SERVICE_DIRECTORY: ${{ inputs.service_directory }}
        COLLECT: ${{ inputs.collect }}
      run: |
        set -euo pipefail
        # Copy to a staging folder so the artifact keeps the paths relative to the service directory.
        stage="$RUNNER_TEMP/test-artifact"
        rm -rf "$stage"
        mkdir -p "$stage"
        cd "$SERVICE_DIRECTORY"
        shopt -s globstar nullglob
        patterns=("test-results/*.xml")
        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] && patterns+=("$pattern")
        done <<< "$COLLECT"
        IFS=$'\n'
        for pattern in "${patterns[@]}"; do
          for file in $pattern; do
            mkdir -p "$stage/$(dirname -- "$file")"
            cp -R "$file" "$stage/$(dirname -- "$file")/"
          done
        done

    - name: Upload Suite Files
      if: ${{ always() && inputs.kind == 'suite' && env.ACT != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: test-${{ inputs.name }}
        path: ${{ runner.temp }}/test-artifact
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload Result
      if: ${{ always() && env.ACT != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: suite-result-${{ inputs.name }}
        path: ${{ runner.temp }}/test-suite-result
        if-no-files-found: ignore
        # Kept for GitHub's longest approval wait; the run record is written after Production approval
        retention-days: 30
