name: Test Runtime
description: Sets up the service's language runtime for a Test job and works out the first part of its cache key

inputs:
  service_directory:
    description: Service directory that holds the language version file
    required: true
  language:
    description: Service language resolved from pipeline settings (service.language)
    required: false
    default: ''
  setup_command:
    description: Setup command from the test plan, hashed into the cache key
    required: false
    default: ''

outputs:
  language:
    description: Language whose runtime was set up, or empty when none was
    value: ${{ steps.runtime.outputs.language }}
  cache_key_prefix:
    description: Cache key without the key_files hash
    value: ${{ steps.key.outputs.prefix }}

runs:
  using: composite
  steps:
    - name: Resolve Test Runtime
      id: runtime
      shell: bash
      env:
        SERVICE_DIRECTORY: ${{ inputs.service_directory }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -euo pipefail

        # Trim only leading and trailing whitespace, so "py thon" stays unsupported
        language="$(printf '%s' "$LANGUAGE" | tr '[:upper:]' '[:lower:]')"
        language="${language#"${language%%[![:space:]]*}"}"
        language="${language%"${language##*[![:space:]]}"}"
        printf '## Test\n\n' >> "$GITHUB_STEP_SUMMARY"

        case "$language" in
          python) version_files=(".python-version") ;;
          node) version_files=(".nvmrc" ".node-version") ;;
          *)
            printf '[STEP: TEST] WARNING: No runtime set up for service.language "%s". The test command runs on the runner as-is.\n' \
              "$language"
            printf -- '- Runtime: **none** (no setup for `service.language`: `%s`)\n' "${language:-unset}" >> "$GITHUB_STEP_SUMMARY"
            printf 'language=\n' >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        for candidate in "${version_files[@]}"; do
          if [[ -f "$SERVICE_DIRECTORY/$candidate" ]]; then
            printf '[STEP: TEST] Using %s version from %s/%s\n' "$language" "$SERVICE_DIRECTORY" "$candidate"
            printf -- '- Runtime: **%s** from `%s`\n' "$language" "$candidate" >> "$GITHUB_STEP_SUMMARY"
            printf 'language=%s\n' "$language" >> "$GITHUB_OUTPUT"
            printf 'version_file=%s\n' "$SERVICE_DIRECTORY/$candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        expected="$(printf '%s or ' "${version_files[@]}")"
        expected="${expected% or }"
        printf 'ERROR: service.language is "%s" but no version file was found in %s. Add %s to the service directory.\n' \
          "$language" "$SERVICE_DIRECTORY" "$expected" >&2
        exit 1

    - name: Set Up Python
      if: ${{ steps.runtime.outputs.language == 'python' }}
      uses: actions/setup-python@v7
      with:
        python-version-file: ${{ steps.runtime.outputs.version_file }}

    - name: Set Up Node
      if: ${{ steps.runtime.outputs.language == 'node' }}
      uses: actions/setup-node@v6
      with:
        node-version-file: ${{ steps.runtime.outputs.version_file }}
        package-manager-cache: false

    - name: Compute Cache Key Prefix
      id: key
      shell: bash
      env:
        LANGUAGE: ${{ steps.runtime.outputs.language }}
        VERSION_FILE: ${{ steps.runtime.outputs.version_file }}
        SETUP_COMMAND: ${{ inputs.setup_command }}
      run: |
        set -euo pipefail
        version="none"
        if [[ -n "$VERSION_FILE" ]]; then
          version="$(tr -d '[:space:]' < "$VERSION_FILE" | tr -c 'A-Za-z0-9._-' '_')"
        fi
        setup_hash="$(printf '%s' "$SETUP_COMMAND" | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
        printf 'prefix=test-%s-%s-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${LANGUAGE:-none}" "$version" "$setup_hash" >> "$GITHUB_OUTPUT"
