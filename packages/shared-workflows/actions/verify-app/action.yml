name: Verify Application
description: Placeholder health verification for a single deployment

inputs:
  deployment_name:
    description: Name of the deployment to verify
    required: true
  category:
    description: Environment category of the deployment
    required: true
  health_endpoint:
    description: Health endpoint path
    required: true
  timeout_seconds:
    description: Verification timeout in seconds
    required: true

runs:
  using: composite
  steps:
    - name: Run Verify Placeholder
      shell: bash
      env:
        DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
        CATEGORY: ${{ inputs.category }}
        HEALTH_ENDPOINT: ${{ inputs.health_endpoint }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      run: |
        # TODO: Resolve the deployment base URL and call the health endpoint.
        printf '[STAGE: VERIFY] Verify %s (%s): would check %s within %ss; not yet implemented.\n' \
          "$DEPLOYMENT_NAME" "$CATEGORY" "$HEALTH_ENDPOINT" "$TIMEOUT_SECONDS"
        {
          printf '## Verify %s\n\n' "$DEPLOYMENT_NAME"
          printf 'Health check of `%s` (timeout %ss): not yet implemented.\n' "$HEALTH_ENDPOINT" "$TIMEOUT_SECONDS"
        } >> "$GITHUB_STEP_SUMMARY"
