# Settings for the release smoke test only. sample-app's own settings keep
# approval_mode all-approvers, but the smoke test runs on every release push to
# main and nobody is there to approve it, so Production approval is skipped under
# an exception that marks this as a platform test. The service directory is still
# sample-app, because it is the parent of this .github directory. It uses the
# structured test settings so the smoke test covers the whole Test stage on hosted
# runners: the cached setup job, parallel suites, collected files and the final step.
version: "1.1"

service:
  name: "sample-app"
  owner_team: "platform-leads"
  language: "python"
  test:
    setup: "mkdir -p .test-cache && echo ready > .test-cache/ready"
    cache:
      paths: [".test-cache"]
      key_files: [".python-version"]
    suites:
      - name: unit
        command: "test -f .test-cache/ready && python3 -m unittest discover -s tests/unit -v && echo unit > .smoke-unit.done"
      - name: integration
        command: "test -f .test-cache/ready && python3 -m unittest discover -s tests/integration -v && echo integration > .smoke-integration.done"
    collect: [".smoke-*.done"]
    final:
      name: verify
      command: "test -f .smoke-unit.done && test -f .smoke-integration.done"

environments:
  - name: dev-env-1
    category: Development
    account_id: "123456789012"
    role_name: pipeline-dev-role
    region: eu-west-2
  - name: preprod-env-1
    category: Pre-production
    account_id: "123456789012"
    role_name: pipeline-preprod-role
    region: eu-west-2
  - name: prod
    category: Production
    account_id: "123456789012"
    role_name: pipeline-prod-role
    region: eu-west-2

governance:
  retention_days: 30
  approvers:
    - "platform-leads"

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
  db_check_required: false

deploy:
  production:
    approval_mode: "unattended"
    exception_id: "PLATFORM-SMOKE-TEST"
