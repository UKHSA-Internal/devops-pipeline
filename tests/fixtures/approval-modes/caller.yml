# Test-only caller for act: a push to main with the settings file given by
# --var SETTINGS_PATH, so Production and the approval jobs are reachable.
name: Approval Modes Caller

on:
  push:
    branches: [main]

jobs:
  pipeline:
    uses: ./.github/workflows/standard-pipeline.yml
    with:
      settings_path: ${{ vars.SETTINGS_PATH }}
