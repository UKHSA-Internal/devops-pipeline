version: "1.0"

service:
  name: "failing-test-app"
  owner_team: "platform-team"
  language: "python"
  test_command: "python3 -c 'import sys; print(\"injected unit test failure\"); sys.exit(1)'"

environments:
  - name: dev-env-1
    category: Development
    account_id: "123456789012"
    role_name: pipeline-dev-role
    region: eu-west-2
  - name: preprod-env-1
    category: Pre-production
    account_id: "123456789012"
    role_name: pipeline-preprod-role
    region: eu-west-2
  - name: prod
    category: Production
    account_id: "123456789012"
    role_name: pipeline-prod-role
    region: eu-west-2

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
