# Error: test.cache has paths but no key_files (CHK-24).
version: "1.1"

service:
  name: "fixture-service"
  owner_team: "platform-team"
  language: "python"
  test:
    setup: "python3 -m venv .venv"
    cache:
      paths: [".venv"]
    suites:
      - name: unit
        command: "python3 -m unittest discover -s tests/unit"

environments:
  - name: dev-env-1
    category: Development
    account_id: "123456789012"
    role_name: pipeline-dev-role
    region: eu-west-2
  - name: preprod-env-1
    category: Pre-production
    account_id: "123456789012"
    role_name: pipeline-preprod-role
    region: eu-west-2
  - name: prod
    category: Production
    account_id: "123456789012"
    role_name: pipeline-prod-role
    region: eu-west-2

governance:
  retention_days: 30
  approvers:
    - "platform-leads"

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
  db_check_required: false

deploy:
  production:
    approval_mode: "all-approvers"
