# Structured test settings: three parallel suites and a final step.
version: "1.1"

service:
  name: "structured-test-service"
  owner_team: "platform-leads"
  language: "python"
  test:
    suites:
      - name: unit
        command: "python3 suite.py unit 5"
      - name: static
        command: "python3 suite.py static 2"
      - name: lint
        command: "python3 suite.py lint 1"
    collect: [".coverage.*"]
    final:
      name: coverage
      command: "python3 final.py"

environments:
  - name: dev-env-1
    category: Development
    account_id: "123456789012"
    role_name: pipeline-dev-role
    region: eu-west-2
  - name: preprod-env-1
    category: Pre-production
    account_id: "123456789012"
    role_name: pipeline-preprod-role
    region: eu-west-2
  - name: prod
    category: Production
    account_id: "123456789012"
    role_name: pipeline-prod-role
    region: eu-west-2

governance:
  retention_days: 30
  approvers:
    - "platform-leads"

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
  db_check_required: false

deploy:
  production:
    approval_mode: "all-approvers"
