version: "1.0"

service:
  name: "fixture-service"
  owner_team: "platform-team"
  language: "python"

environments:
  - name: "fixture-dev"
    category: "Development"
    account_id: "123456789012"
    role_name: "fixture-deployment-role"
    region: "eu-west-2"

governance:
  retention_days: 30
  shared_workflow_ref: "v1"
  approvers:
    - "platform-leads"

verification:
  health_endpoint: "/health"
  timeout_seconds: 60
  db_check_required: false
